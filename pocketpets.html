<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Pets 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--pn:#fffaf2;--pn2:#fff0d9;--tx:#3b2f4a;--ac:#ff7eb6;--ac2:#7c5cff;--bd:#ecd5bb;--ol:#2b1f3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0;background:#bfe9ff;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;color:var(--tx);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;font-weight:700;font-size:16px;border:3px solid var(--ol);border-radius:14px;padding:9px 13px;color:#fff;text-shadow:0 2px 0 #0006;background:var(--ac);box-shadow:0 4px 0 #c24e86;cursor:pointer;transition:transform .08s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.1)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
button.b2{background:var(--ac2);box-shadow:0 4px 0 #4b33b8}
button.g{background:#44b86a;box-shadow:0 4px 0 #2b8a4b}
button.x{background:#9a8fa8;box-shadow:0 4px 0 #6f6580}
button:disabled{opacity:.45;cursor:not-allowed}
small{opacity:.8}
#top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:10px;pointer-events:none}
.chip{background:var(--pn);border:3px solid var(--ol);border-radius:18px;padding:5px 14px;font-weight:600;font-size:18px;box-shadow:0 4px 0 var(--bd);text-align:center}
.money{min-width:120px}.money #cu{font-size:20px;font-weight:700}.money small{display:block;font-size:12px;color:#2b8a4b;font-weight:700;opacity:1;line-height:1}
#hub{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:10px;padding:6px 12px;font-size:14px;background:#9a8fa8;box-shadow:0 4px 0 #6f6580;z-index:5}
#cs{position:fixed;top:calc(env(safe-area-inset-top,0px) + 100px);left:12px;font-size:12px;font-weight:600;opacity:.85}
#side{position:fixed;left:8px;top:50%;transform:translateY(-55%);display:flex;flex-direction:column;gap:8px}
.sb{width:60px;padding:5px 2px;font-size:11px;line-height:1.1;background:var(--pn);color:var(--tx);text-shadow:none;box-shadow:0 4px 0 var(--bd);position:relative}
.sb span{display:block;font-size:24px}
.bd{display:none;position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:#ff3b5c;border:2px solid #fff;animation:pl .6s infinite alternate}
#ca{position:fixed;right:10px;top:50%;transform:translateY(-55%);padding:10px 12px;font-size:15px;line-height:1.2}
#ca small{display:block;font-size:15px;opacity:1;color:#fff4a8}
#dock{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px}
#eggs{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:4px 6px 8px;scroll-snap-type:x proximity}
.eb{min-width:74px;font-size:12px;padding:5px 6px;line-height:1.15;background:var(--pn);color:var(--tx);text-shadow:none;box-shadow:0 4px 0 var(--bd);scroll-snap-align:center}
.eb span{font-size:24px;display:block}.eb small{display:block;font-size:11px}
.eb.sel{background:#ffd666;box-shadow:0 4px 0 #b37a00;transform:translateY(-4px);outline:3px solid #fff}
.eb.no{opacity:.65}
#hbar{display:flex;gap:10px;align-items:center;justify-content:center}
#h1{font-size:20px;padding:10px 22px;min-width:150px;background:#ffb300;box-shadow:0 5px 0 #b37a00;animation:pl .8s infinite alternate}
#h3{font-size:18px;padding:10px 16px;animation:pl .8s infinite alternate}
#h1 small,#h3 small{display:block;font-size:13px;font-weight:600;opacity:1}
#h1.no,#h3.no{animation:none;opacity:.7}
#ha{padding:8px 12px;font-size:14px}#ha.on{background:#44b86a;box-shadow:0 4px 0 #2b8a4b}
.shake{animation:sk .35s}
@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pl{to{transform:scale(1.06)}}
#res{position:fixed;left:0;right:0;top:16%;text-align:center;pointer-events:none;font-size:clamp(26px,6vw,46px);font-weight:700;-webkit-text-stroke:2px #2b1f3a;paint-order:stroke fill;text-shadow:0 4px 0 #2b1f3a}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#toast{position:fixed;left:50%;bottom:190px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--pn);color:var(--tx);border:3px solid var(--ol);border-radius:16px;padding:8px 16px;font-weight:600;max-width:90vw;text-align:center;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#tip{display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);width:min(320px,80vw);background:var(--pn);border:3px solid var(--ol);border-radius:18px;padding:12px;text-align:center;box-shadow:0 5px 0 var(--bd)}
#tip button{margin-top:8px;padding:6px 16px}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(3px)}
#box{background:var(--pn);border:4px solid var(--ol);border-radius:24px;width:min(660px,100%);height:min(86vh,720px);display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;gap:6px;padding:10px;border-bottom:3px solid var(--bd)}
.tabs{display:flex;gap:6px;flex:1;overflow-x:auto}
.tab{background:var(--pn2);color:var(--tx);text-shadow:none;box-shadow:0 3px 0 var(--bd);padding:6px 10px;font-size:13px;white-space:nowrap}
.tab span{margin-right:4px}.tab.on{background:var(--ac2);color:#fff;box-shadow:0 3px 0 #4b33b8}
.xb{background:#ff5a6e;box-shadow:0 3px 0 #b3354a;padding:6px 12px}
.mb{padding:12px;overflow:auto;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.card{position:relative;background:var(--pn2);border:3px solid var(--rc,#ccc);border-radius:16px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.card.lock .th{filter:brightness(0) opacity(.35)}
.th{width:72px;height:72px}
.cnt{position:absolute;top:4px;right:6px;background:var(--rc);color:#fff;font-weight:700;border-radius:10px;padding:0 7px;font-size:13px;border:2px solid var(--ol)}
.ca{display:flex;gap:4px;margin-top:4px}.ca button{padding:3px 8px;font-size:15px;border-radius:10px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.mg{font-size:11px;font-weight:700;color:#2b8a4b}
.bar{height:12px;background:var(--bd);border-radius:8px;overflow:hidden;border:2px solid var(--ol);margin:4px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#44b86a,#9be564)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.ecard,.ucard,.wcard{background:var(--pn2);border:3px solid var(--bd);border-radius:16px;padding:10px;margin-bottom:10px}
.ecard.on{border-color:#ffb300}
.eh{display:flex;align-items:center;gap:10px}.ei{font-size:34px}.eh div{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini{border:2px solid var(--rc);border-radius:12px;padding:2px 4px;width:78px;text-align:center;display:flex;flex-direction:column;align-items:center;background:var(--pn)}
.mini .th{width:48px;height:48px}.mini small{font-size:10px;line-height:1.1}
.pips{display:flex;gap:4px;margin-top:4px}.pips i{width:14px;height:14px;border-radius:50%;background:var(--bd);border:2px solid var(--ol)}.pips i.on{background:#44b86a}
.ucard,.wcard{display:flex;align-items:center;gap:10px}.ic{font-size:32px;width:46px;text-align:center}.ucard .t,.wcard .t{flex:1}
.empty{text-align:center;padding:30px 10px;opacity:.8;font-size:18px}
.pop{position:fixed;pointer-events:none;font-weight:700;font-size:22px;color:#ffb300;-webkit-text-stroke:1px #2b1f3a;animation:up 1s forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
@media (max-width:520px){.sb{width:52px;font-size:10px}.sb span{font-size:21px}#h1{min-width:120px;padding:9px 14px}#ca{font-size:13px;padding:8px}}
</style></head><body>
<div id="top"><div class="chip" id="wn"></div><div class="chip money"><div id="cu"></div><small id="inc"></small></div></div>
<div id="side">
<button class="sb" onclick="openP('bp')"><span>🎒</span>Pets<i class="bd" id="bBp"></i></button>
<button class="sb" onclick="openP('eg')"><span>📊</span>Eggs</button>
<button class="sb" onclick="openP('up')"><span>⚡</span>Upgrades<i class="bd" id="bUp"></i></button>

<button class="sb" onclick="openP('wd')"><span>🚀</span>Worlds<i class="bd" id="bWd"></i></button>
</div>
<button id="ca" class="g" onclick="collectAll()" title="Collect all (R)"></button>
<button id="hub" onclick="goHub()">🏠 Hub</button>
<div id="cs"></div>
<div id="tip"><b>Welcome! 🐾</b><br>Tap your pets to collect coins. Hatch eggs to find new pets, and merge 10 of the same into a rarer one!<br><button onclick="S.tut=1;hud();save()">Got it!</button></div>
<div id="res"></div><div id="fl"></div><div id="toast"></div>
<div id="dock"><div id="eggs"></div><div id="hbar">
<button id="ha" class="b2" onclick="togAuto()"></button>
<button id="h1" onclick="hatch(1)" title="Hatch (E)"></button>
<button id="h3" class="b2" onclick="hatch(3)" title="Hatch x3 (3)"></button>
</div></div>
<div id="modal" onclick="if(event.target==this)closeP()"><div id="box"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const RK={c:0,u:1,r:2,e:3,l:4,g:5,h:6,s:7};
const R=['Common','Uncommon','Rare','Epic','Legendary','Godly','Ethereal','Secret'];
const RC=['#9a9a9a','#4fb04f','#3b8fe8','#a05af0','#f5a01c','#ff4d6d','#27d3e8','#ff2fd6'];
const WT=[50,26,12,7,3.5,1.5,.45,.05],BV=[1,2.5,6,15,40,120,400,2000],WM=[1,50,500,2000,1e4,5e4];
const UC=[0,2e4,3e5,3e6,3e7,3e8],TM=[1,3,10,40],TN=['','Shiny ','Insane ','Supreme '];
const ECOL=[0xffe9a8,0x7ed957,0x4cc9f0,0xb06bff,0xff4d6d],MAXP=15;
// eggs: [id,name,icon,cost,"r:pets|r:pets"]  c u r e l g h(ethereal) s(secret)
const W=[
{n:'Meadow',e:'🌿',c:'Coins',g:0x7ed957,sky:0xbfe9ff,eg:[
['basic','Basic Egg','🥚',10,'c:Cat,Dog|u:Bunny|r:Fox|s:Star Dragon'],
['forest','Forest Egg','🌿',50,'c:Pup,Kitty|u:Bird,Frog|r:Turtle,Owl|e:Phoenix|l:Raccoon'],
['crystal','Crystal Egg','💎',250,'u:Chick|r:Dragon|e:Lion,Tiger|l:Duckling,Unicorn|g:Dolphin,Gold Leopard|s:Crazy Whale'],
['cosmic','Cosmic Egg','🌌',1000,'r:Cow,Sheep|e:Wolf,Mouse|l:Llama,Camel|g:Rainbow Unicorn,Pegasus|h:Squirrel,Flufftopus|s:Royal Squirrel'],
['mythic','Mythic Egg','🔥',5000,'e:Griffin,Mythical Lion|l:Royal Wand,Royal Staff|h:Royal Flufftopus|g:Deck of Cards|s:Royal Pup,Royal Kitty,Royal Ducky']]},
{n:'Volcano',e:'🌋',c:'Shards',g:0x6b3b2e,sky:0xff9a6b,eg:[
['ember','Ember Egg','🔥',500,'c:Lava Pup|u:Fire Frog|r:Scorch Wolf|e:Magma Drake|s:Ifrit'],
['magma','Magma Egg','🌋',2500,'u:Ember Cat|r:Ash Owl|e:Flame Lion|l:Inferno Stallion|g:Demon Lord|s:Volcanic Phoenix'],
['solar','Solar Egg','☀️',10000,'r:Cinder Turtle|e:Magma Bunny|l:Firebird|h:Solar Whale|s:Sun Angel'],
['inferno','Inferno Egg','☄️',50000,'e:Blaze Fox|l:Meteor Dragon|g:Lava Whale|s:Volcanic Phoenix'],
['core','Core Egg','🌋',200000,'l:Magma Golem|h:Comet Dragon,Lava Flufftopus|s:Ifrit,Volcanic Phoenix']]},
{n:'Void',e:'🌌',c:'Void Coins',g:0x1c1233,sky:0x0a0618,eg:[
['shadow','Shadow Egg','🌑',5000,'c:Shadow Pup|u:Cosmic Frog|r:Void Fox|e:Void Dragon|s:The Watcher'],
['nebula','Nebula Egg','🌌',25000,'u:Dark Kit|r:Galaxy Raccoon|e:Abyss Tiger|l:Galaxy Pegasus|g:Void Angel|s:Black Hole'],
['star','Star Egg','⭐',100000,'r:Star Owl|e:Void Bunny|l:Star Griffin|h:Void Star Dragon|s:Gravity Ghost'],
['galaxy','Galaxy Egg','🌠',500000,'e:Nova Frog|l:Shadow Demon|g:Cosmic Whale|s:The Watcher'],
['void','Void Egg','🕳️',1000000,'l:Void Knight|h:Void Whale,Void Flufftopus|s:Black Hole,The Watcher,Gravity Ghost']]},
{n:'Crystal Ocean',e:'🌊',c:'Pearls',g:0xf2dfa8,sky:0x6fd3ff,eg:[
['tide','Tide Egg','🐚',20000,'c:Crab,Fishy|u:Starfish,Clam|r:Sea Turtle|e:Seahorse|s:Pearl Dragon'],
['reef','Reef Egg','🪸',100000,'u:Jelly Pup|r:Clownfish|e:Octopus,Seal|l:Manta Ray|g:Narwhal|s:Reef Queen'],
['deep','Deep Egg','🌊',500000,'r:Anglerfish|e:Shark Pup|l:Orca|g:Sea Dragon|h:Aqua Flufftopus|s:Kraken'],
['abyssal','Abyssal Egg','🌀',2500000,'e:Electric Eel|l:Crystal Whale|g:Leviathan|h:Royal Octopus|s:Kraken,Poseidon']]},
{n:'Candy Land',e:'🍭',c:'Sprinkles',g:0xffc4e1,sky:0xffe3f4,eg:[
['sugar','Sugar Egg','🍬',100000,'c:Gummy,Lolli Pup|u:Cupcake|r:Donut Cat|e:Choco Pup|s:Candy Dragon'],
['frosting','Frosting Egg','🧁',500000,'u:Cotton Bunny|r:Cotton Fox|e:Marshmallow Bear|l:Ice Cream Cat|g:Sundae Pup|s:Rainbow Sundae'],
['choco','Choco Egg','🍫',2500000,'r:Fudge Frog|e:Brownie Bear|l:Choco Dragon|h:Chocolate Flufftopus|s:Cocoa King'],
['wonder','Wonder Egg','🍭',10000000,'e:Sprinkle Wolf|l:Candy Cane Deer|g:Cake Unicorn|h:Cotton Flufftopus|s:Rainbow Sundae,Sugar Queen']]},
{n:'Bear World',e:'🐻',c:'Honey',g:0x8fc36a,sky:0xfff3c4,eg:[
['cub','Cub Egg','🐻',500000,'c:Cub,Teddy|u:Honey Bear|r:Panda|e:Koala Bear|s:Golden Bear'],
['den','Den Egg','🏕️',2500000,'u:Brown Bear|r:Polar Bear|e:Grizzly|l:Sun Bear|g:Teddy King|s:Honey King'],
['hive','Hive Egg','🍯',10000000,'r:Beehive Bear|e:Bumble Bear|l:Queen Bee Bear|h:Honey Flufftopus|s:Honey King'],
['cosmicb','Starry Egg','🌟',50000000,'e:Star Bear|l:Moon Bear|g:Galaxy Bear|h:Cosmic Bear|s:Bear God']]}];
// pet look from name
const hs=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
function sty(n){const h=hs(n),L=n.toLowerCase(),has=(...a)=>a.some(x=>L.includes(x));let hue=h%360,s=.65,l=.62;
 if(has('lava','ember','magma','fire','flame','inferno','scorch','blaze','volcan','cinder','ifrit','demon','comet','meteor'))hue=h%40;
 else if(has('void','shadow','dark','abyss','watcher','black','gravity','nova'))hue=255+h%50,l=.48;
 else if(has('star','sun','solar','gold','honey','royal','bee'))hue=38+h%18;
 else if(has('sea','fish','whale','aqua','kraken','octopus','crab','clam','reef','narwhal','shark','orca','eel','manta','pearl','jelly','leviathan','poseidon','seal','seahorse'))hue=180+h%40;
 else if(has('cotton','candy','sundae','sugar','cupcake','gummy','lolli','donut','cake','sprinkle','rainbow','unicorn','marshmallow','ice cream'))hue=290+h%60,l=.75;
 else if(has('choco','cocoa','fudge','brownie','grizzly','brown','teddy','cub'))hue=25,s=.5,l=.4;
 if(has('panda','polar','snow'))s=.05,l=.92;
 const e=has('bunny')?'l':has('fox','cat','kit','wolf','tiger','lion','leopard','dragon','drake','demon','deer','stallion','pegasus','llama','camel','raccoon','squirrel','mouse')?'p':has('whale','fish','crab','clam','octopus','flufftopus','kraken','eel','starfish','turtle','frog','chick','duck','bird','owl','phoenix','firebird','angel','ghost','hole')?'n':'r';
 let f=0;if(has('bird','owl','phoenix','firebird','griffin','pegasus','angel','chick','dragon','drake','ray','bee'))f|=1;if(has('dragon','drake','demon','unicorn','ifrit','stallion','golem','king','queen'))f|=2;
 return{c:new THREE.Color().setHSL(hue/360,s,l).getHex(),e,f}}
const PL=[];
W.forEach((w,wi)=>{const m={},L=PL[wi]=[];w.eg=w.eg.map(a=>{const pool=a[4].split('|').map(s=>{const[k,v]=s.split(':');return[RK[k],v.split(',').map(n=>{let x=m[n];if(x===undefined)x=m[n]=L.push(Object.assign({n,r:RK[k]},sty(n)))-1;return x})]});return{id:a[0],n:a[1],i:a[2],c:a[3],pool}})});
const fmt=n=>{n=Math.floor(n);if(n<1e3)return n+'';const s=['','K','M','B','T','Qa','Qi'];let i=0,x=n;while(x>=1000&&i<6){x/=1000;i++}return x.toFixed(x<10?2:1)+s[i]};
const fresh=()=>({cw:0,cur:[100,0,0,0,0,0],un:[1,0,0,0,0,0],inv:{},hab:[[],[],[],[],[],[]],show:[null,null,null,null,null,null],egg:[0,0,0,0,0,0],up:{tri:0,auto:0,luck:0,inc:0},seen:{},autoOn:false});
let S=fresh();
try{const l=localStorage.getItem('pocketpets3d_v2');if(l)S=Object.assign(fresh(),JSON.parse(l))}catch(e){}
const save=()=>{if(window.cloudReady!==false)S.ts=Date.now();try{localStorage.setItem('pocketpets3d_v2',JSON.stringify(S))}catch(e){}if(window.cloudSave)window.cloudSave()};
async function goHub(){try{if(window.cloudFlush)await Promise.race([window.cloudFlush(),new Promise(r=>setTimeout(r,2500))])}catch(e){}location.href='index.html'}const pk=k=>k.split(':').map(Number);
const pr=(w,i)=>PL[w][i].r;
const val=k=>{const[w,i,t]=pk(k);return BV[pr(w,i)]*WM[w]*TM[t]};
const nm=k=>{const[w,i,t]=pk(k);return TN[t]+PL[w][i].n};
const incM=()=>1+.5*S.up.inc;
const cE=()=>W[S.cw].eg[S.egg[S.cw]];
const placedCount=k=>S.hab[S.cw].filter(x=>x==k).length+(S.show[S.cw]==k?1:0);

// ---------- 3D ----------
const cv=document.createElement('canvas');document.body.prepend(cv);
const ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(50,1,.1,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x887799,.95));
const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(5,10,7);scene.add(dl);
const ground=new THREE.Mesh(new THREE.CylinderGeometry(8,8,.5,48),new THREE.MeshLambertMaterial({color:0x7ed957}));ground.position.y=-.25;scene.add(ground);
const mount=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.9,2,24),new THREE.MeshLambertMaterial({color:0x9a8a7a}));mount.position.y=1;scene.add(mount);
const nest=new THREE.Group(),nestM=new THREE.MeshLambertMaterial({color:0x8b5a2b});
const tor=new THREE.Mesh(new THREE.TorusGeometry(.95,.24,8,24),nestM);tor.rotation.x=Math.PI/2;tor.position.y=2.1;nest.add(tor);
const straw=new THREE.Mesh(new THREE.CylinderGeometry(.92,.92,.2,20),new THREE.MeshLambertMaterial({color:0xf2d27a}));straw.position.y=2.05;nest.add(straw);
for(let n=0;n<14;n++){const a=n/14*Math.PI*2,tw=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.7,5),nestM);tw.position.set(Math.cos(a)*1.0,2.2,Math.sin(a)*1.0);tw.rotation.set(Math.random()*1.5,a,Math.random()*1.5);nest.add(tw)}
scene.add(nest);
const egg=new THREE.Mesh(new THREE.SphereGeometry(.6,20,16),new THREE.MeshLambertMaterial({color:0xffe9a8,emissive:0xffe9a8,emissiveIntensity:.35}));
