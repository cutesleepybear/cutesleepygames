<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>My Dogs</title>
<style>
:root{--bg:#fff4e6;--cd:#fff;--tx:#3b2a20;--ac:#ff8a4c;--mu:#8a7566;--bd:#f1dcc6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1712;--cd:#2b211a;--tx:#f5e8dc;--mu:#b8a290;--bd:#43342a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1712;--cd:#2b211a;--tx:#f5e8dc;--mu:#b8a290;--bd:#43342a;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{max-width:760px;margin:0 auto;padding:12px 12px 40px}
h1{font-size:22px;margin:4px 0 8px}h2{font-size:16px;margin:18px 0 8px}
#hud{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:20;font-weight:600}
#hud span{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:4px 10px;font-size:14px}
nav{display:flex;gap:6px;margin:6px 0}
nav button{flex:1;font-size:12px;padding:9px 2px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;font-weight:600;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.dc{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;text-align:center}
.dc small{color:var(--mu)}.em{opacity:.5;justify-content:center;min-height:120px;border-style:dashed}
.sp{position:relative;height:96px}.hr{position:absolute;inset:0;pointer-events:none}
.fl{position:absolute;left:50%;top:10px;font-weight:700;color:var(--ac);animation:fl 1s forwards}
@keyframes fl{to{transform:translateY(-40px);opacity:0}}
.xp{height:6px;border-radius:3px;background:var(--bd);overflow:hidden}.xp u{display:block;height:100%;background:#5bc47a}
.bt{display:flex;gap:4px}
button,select{font:inherit;font-size:13px}
.bt button,.bt select,.b{flex:1;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--ac);color:#fff;cursor:pointer;min-width:0}
.bt .g{background:var(--cd);color:var(--tx)}.bt select{background:var(--cd);color:var(--tx)}
button:disabled{opacity:.45;cursor:default}
.b{display:inline-block;flex:none;padding:8px 12px}
#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#3b2a20;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:30;text-align:center}
/* sprites */
.dg{position:relative;width:96px;height:90px;margin:0 auto;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}@keyframes wag{to{transform:rotate(-5deg)}}
.dg i{position:absolute;display:block}
.bd{left:18px;top:46px;width:60px;height:40px;border-radius:24px 24px 18px 18px;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.pw{top:78px;width:16px;height:10px;border-radius:8px;background:var(--s);z-index:1}
.tl{left:8px;top:48px;width:22px;height:12px;border-radius:10px;background:var(--c);transform:rotate(-30deg);animation:wag .4s infinite alternate}
.hd{left:20px;top:8px;width:56px;height:50px;border-radius:50%;background:var(--c);z-index:2;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.pom .hd{left:16px;width:64px;height:56px;top:6px;box-shadow:0 0 0 4px var(--c)}
.ea{background:var(--e);z-index:1}
.ea.f{top:16px;width:20px;height:32px;border-radius:50% 50% 60% 60%}.ea.f.l{left:12px;transform:rotate(14deg)}.ea.f.r{left:64px;transform:rotate(-14deg)}
.ea.p{top:0;width:22px;height:28px;clip-path:polygon(50% 0,0 100%,100% 100%)}.ea.p.l{left:20px;transform:rotate(-10deg)}.ea.p.r{left:54px;transform:rotate(10deg)}
.ea.o{top:8px;width:22px;height:22px;border-radius:50%}.ea.o.l{left:12px}.ea.o.r{left:62px}
.sn{left:34px;top:34px;width:28px;height:20px;border-radius:50%;background:var(--s);z-index:3}
.ey{top:27px;width:9px;height:10px;border-radius:50%;background:#2b1b14;z-index:4}
.ey:after{content:"";position:absolute;left:2px;top:1px;width:3px;height:3px;border-radius:50%;background:#fff}
.nz{left:43px;top:35px;width:10px;height:7px;border-radius:50% 50% 60% 60%;background:#1d120d;z-index:4}
.tg{left:45px;top:47px;width:7px;height:8px;border-radius:0 0 6px 6px;background:#ff7f9a;z-index:4}
.ch{top:40px;width:9px;height:6px;border-radius:50%;background:#ff9fb0;opacity:.65;z-index:4}
.x{z-index:3}.sk{position:absolute;z-index:6;line-height:1}
.shy i{filter:hue-rotate(150deg) saturate(1.5)}.shy{filter:drop-shadow(0 0 6px gold)}@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
.nm{font:inherit;font-weight:700;text-align:center;background:transparent;color:var(--tx);border:1px dashed var(--bd);border-radius:6px;padding:3px;width:100%;box-sizing:border-box}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.top h1{margin:4px 0}#hub{font-size:13px;font-weight:600;text-decoration:none;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;white-space:nowrap}
</style></head><body>
<div class=top><h1>🐶 My Dogs</h1><a id=hub href="index.html">← Back to Hub</a></div><div id="hud"></div>
<nav id="nv"></nav><div id="app"></div><div id="ts"></div>
<script>
const B={
lab:{n:"Labrador",c:"#e9c777",e:"#c89f4d",s:"#f7e6b8",t:"f",$:150,d:"Balanced starter"},
poo:{n:"Poodle",c:"#f3ece2",e:"#e6d8c3",s:"#fffaf2",t:"o",$:400,d:"+50% pet coins",x:'<i class=x style="left:33px;top:-3px;width:30px;height:26px;border-radius:50%;background:#f3ece2;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)"></i>'},
pug:{n:"Pug",c:"#d9b98a",e:"#3a2e28",s:"#4a3a31",t:"o",$:700,d:"Pet cooldown only 4s"},
hus:{n:"Husky",c:"#8b97a3",e:"#5f6a75",s:"#fff",t:"p",$:1000,d:"+50% passive, pets give 0",x:'<i class=x style="left:30px;top:14px;width:36px;height:34px;border-radius:50%;background:#fff;z-index:2"></i>'},
bea:{n:"Beagle",c:"#d99a5b",e:"#7a4a2b",s:"#fff",t:"f",$:1800,d:"20% chance pets pay 5x",x:'<i class=x style="left:43px;top:12px;width:10px;height:24px;border-radius:5px;background:#fff;z-index:2"></i>'},
cor:{n:"Corgi",c:"#e8933e",e:"#e8933e",s:"#fff3e0",t:"p",$:2500,d:"+20% coins to roommates",x:'<i class=x style="left:42px;top:12px;width:12px;height:26px;border-radius:6px;background:#fff;z-index:2"></i>'},
shi:{n:"Shiba Inu",c:"#e59a48",e:"#e59a48",s:"#fff4e0",t:"p",$:4000,d:"+25% all coins",x:'<i class=x style="left:33px;top:20px;width:6px;height:6px;border-radius:50%;background:#fff4e0"></i><i class=x style="left:57px;top:20px;width:6px;height:6px;border-radius:50%;background:#fff4e0"></i>'},
gol:{n:"Golden Retriever",c:"#e3a64a",e:"#c0822c",s:"#f5d594",t:"f",$:6000,d:"50% chance to keep the bone"},
dal:{n:"Dalmatian",c:"#fafafa",e:"#2b2b2b",s:"#fff",t:"f",$:10000,d:"2x XP from bones",x:'<i class=x style="left:28px;top:12px;width:10px;height:10px;border-radius:50%;background:#2b2b2b;z-index:2"></i><i class=x style="left:60px;top:48px;width:9px;height:9px;border-radius:50%;background:#2b2b2b;z-index:3"></i><i class=x style="left:28px;top:62px;width:11px;height:11px;border-radius:50%;background:#2b2b2b;z-index:1"></i>'},
pom:{n:"Pomeranian",c:"#f0a35a",e:"#f0a35a",s:"#ffe2c0",t:"p",$:15000,d:"3x level-up bonus"},
sam:{n:"Samoyed",c:"#fdfdfd",e:"#f0e6dc",s:"#fff",t:"p",$:20000,u:1,d:"+30% coins to roommates"},
dac:{n:"Dachshund",c:"#a4552d",e:"#6f3519",s:"#d9955f",t:"f",$:35000,u:2,d:"Pets pay 3x"},
aki:{n:"Akita",c:"#b8643a",e:"#b8643a",s:"#fff",t:"p",$:60000,u:3,d:"+100% passive income",x:'<i class=x style="left:30px;top:14px;width:36px;height:34px;border-radius:50%;background:#fff;z-index:2"></i>'}};
const P={playful:["🎾","Playful"],lazy:["💤","Lazy"],hungry:["🍖","Hungry"],loyal:["❤️","Loyal"]};
const R=[["Living Room",0],["Backyard",1000],["Kitchen",5000],["Master Bedroom",20000]];
const K=[["wings","🕊️","Angel Wings",5],["melon","🍉","Watermelon Suit",10],["hat","🎩","Fancy Top Hat",15],["crown","👑","Golden Crown",25]];
const NM=["Biscuit","Mochi","Waffles","Pickles","Bean","Peanut","Nugget","Cookie","Maple","Ziggy","Pancake","Toast","Luna","Bobo","Churro","Noodle"];
let S,tab=0;
const fresh=()=>({coins:200,bones:0,paws:0,dogs:[],rooms:[0],skins:[],sh:[],t:0});
try{S=JSON.parse(localStorage.getItem("doggy1"))}catch(e){}
S=S||fresh();S.v=S.v||[];S.pr=S.pr||0;
const save=()=>{try{localStorage.setItem("doggy1",JSON.stringify(S))}catch(e){}window.cloudSave&&window.cloudSave()};
const ks=Object.keys(B),G=()=>1+S.paws*.1,f=n=>Math.floor(n).toLocaleString();
const roll=()=>{S.sh=ks.filter(k=>(B[k].u||0)<=(S.pr||0)).sort(()=>Math.random()-.5).slice(0,3)};
if(!S.sh.length)roll();
const starter=()=>S.dogs.push({id:"d"+Math.random().toString(36).slice(2,8),k:"lab",n:"Biscuit",p:"loyal",l:1,x:0,r:0,sk:"",pa:0});
if(!S.dogs.length)starter();
const toast=m=>{const t=document.getElementById("ts");t.textContent=m;t.style.opacity=1;clearTimeout(t.h);t.h=setTimeout(()=>t.style.opacity=0,1800)};
const mates=d=>S.dogs.filter(o=>o!==d&&o.r===d.r);
const tr=(d,k)=>1+.15*((d.t||{})[k]||0);
const ST=[["a","💪 Stamina","+15% passive"],["b","🎾 Charm","+15% pet"],["c","🧠 Smarts","+15% XP"]];
const mult=d=>G()*(mates(d).some(o=>o.k=="cor")?1.2:1)*(d.k=="shi"?1.25:1)*(mates(d).some(o=>o.k=="sam")?1.3:1)*(d.sh?2:1);
const pass=d=>d.l*mult(d)*tr(d,"a")*(d.k=="aki"?2:1)*(d.p=="lazy"?1.3:1)*(d.p=="loyal"?1.2:1)*(d.k=="hus"?1.5:1);
function sprite(k,sk,sh){const b=B[k],w='font-size:32px;top:36px;';
return `<div class="dg${k=="pom"||k=="sam"?" pom":""}${sh?" shy":""}" style="--c:${b.c};--e:${b.e};--s:${b.s}">${sh?'<span class=sk style="left:4px;top:4px;font-size:16px;animation:tw 1.2s infinite">✨</span><span class=sk style="right:2px;top:26px;font-size:12px;animation:tw 1.2s .6s infinite">✨</span>':""}${sk=="wings"?`<span class=sk style="${w}left:-10px;z-index:0">🕊️</span><span class=sk style="${w}right:-10px;z-index:0;transform:scaleX(-1)">🕊️</span>`:""}<i class=tl></i><i class=bd></i><i class=pw style="left:26px"></i><i class=pw style="left:54px"></i><i class="ea l ${b.t}"></i><i class="ea r ${b.t}"></i><i class=hd></i>${b.x||""}<i class=sn></i><i class=ey style="left:32px"></i><i class=ey style="left:55px"></i><i class=nz></i><i class=tg></i><i class=ch style="left:24px"></i><i class=ch style="left:63px"></i>${sk=="melon"?'<span class=sk style="font-size:28px;left:34px;top:52px">🍉</span>':""}${sk=="hat"?'<span class=sk style="font-size:34px;left:30px;top:-12px">🎩</span>':""}${sk=="crown"?'<span class=sk style="font-size:32px;left:32px;top:-10px">👑</span>':""}</div>`}
function card(d){const b=B[d.k],p=P[d.p];
return `<div class=dc><div class=sp>${sprite(d.k,d.sk,d.sh)}<div class=hr id=h${d.id}></div></div><input class=nm value="${d.n}" maxlength=14 title="Tap to rename" onchange="ren('${d.id}',this.value)"><small>${d.sh?"✨ Shiny ":""}${b.n} · ${p[0]} ${p[1]}</small><small>Level ${d.l} · ${f(pass(d))}/min</small><div class=xp><u style="width:${d.x/(d.l*40)*100}%"></u></div><div class=bt><button id=p${d.id} onclick="pet('${d.id}')">Pet</button><button onclick="feed('${d.id}')">🦴 Feed</button></div><div class=bt><button class=g onclick="mv('${d.id}')">Move</button><button class=g title="Store in Vault" onclick="store('${d.id}')">📦</button><select onchange="skin('${d.id}',this.value)"><option value="">No skin</option>${S.skins.map(s=>`<option value=${s} ${d.sk==s?"selected":""}>${K.find(x=>x[0]==s)[1]} ${K.find(x=>x[0]==s)[2]}</option>`).join("")}</select></div></div>`}
function hud(){document.getElementById("hud").innerHTML=`<span>🪙 ${f(S.coins)}</span><span>🦴 ${S.bones}</span><span>🐾 ${S.paws}</span><span title="Passive income arrives every 60 seconds">⏱ Pack pays in ${60-S.t}s</span>`;
const n=Date.now();S.dogs.forEach(d=>{const b=document.getElementById("p"+d.id);if(!b)return;const c=Math.ceil(((d.k=="pug"?4e3:1e4)-(n-(d.pa||0)))/1e3);b.disabled=c>0;b.textContent=c>0?c+"s":"Pet"})}
function render(){
document.getElementById("nv").innerHTML=["🏠 Mansion","🛒 Shop","✨ Prestige","⚙️ Train","📦 Vault"].map((t,i)=>`<button class="${tab==i?"on":""}" onclick="tab=${i};render()">${t}</button>`).join("");
let h="";
if(tab==0){if(!S.dogs.length)h+='<p>No dogs yet! Head to the Shop and adopt your first pup 🐾</p>';
S.rooms.forEach(r=>{const ds=S.dogs.filter(d=>d.r==r);h+=`<h2>${R[r][0]} (${ds.length}/3)</h2><div class=grid>${ds.map(card).join("")}${ds.length<3?'<div class="dc em">🛏️ Empty bed</div>':""}</div>`})}
if(tab==1){h+=`<h2>Bone shop</h2><div class=bt><button onclick="bone(1)">Buy 1 · 15 🪙</button><button onclick="bone(10)">Buy 10 · 150 🪙</button></div><h2>Shelter</h2><div class=grid>${S.sh.map((k,i)=>`<div class=dc><div class=sp>${sprite(k)}</div><b>${B[k].n}</b><small>${B[k].d}</small><input class=nm id=nm${i} placeholder="Name your pup" maxlength=14><select id=ps${i}>${Object.keys(P).map(p=>`<option value=${p}>${P[p][0]} ${P[p][1]}</option>`).join("")}</select><button class=b onclick="adopt(${i})">Adopt · ${f(B[k].$)} 🪙</button></div>`).join("")}</div><p><button class=b onclick="spend(50)&&(roll(),render())">🔄 Refresh · 50 🪙</button></p><p><small>🔒 ${ks.filter(k=>(B[k].u||0)>(S.pr||0)).length?"Move house to unlock rare breeds!":"All breeds unlocked!"}</small></p><h2>Mansion rooms</h2><div class=grid>${R.map((r,i)=>`<div class=dc><b>${r[0]}</b><small>Holds 3 dogs</small>${S.rooms.includes(i)?"<small>✅ Owned</small>":`<button class=b onclick="room(${i})">Unlock · ${f(r[1])} 🪙</button>`}</div>`).join("")}</div>`}
if(tab==2){const tl=S.dogs.reduce((a,d)=>a+d.l,0),pg=Math.floor(tl/5);
h+=`<h2>Move to a new house</h2><p>📦 Store dogs in the Vault first to keep them! Each move unlocks rarer breeds (you’ve moved ${S.pr||0} times).</p><p>Combined dog level: <b>${tl}</b> (need 10). Moving resets dogs, rooms and coins but grants <b>${tl>=10?pg:0} 🐾</b>. Each 🐾 gives a permanent +10% coins (currently +${Math.round((G()-1)*100)}%).</p><button class=b ${tl<10?"disabled":""} onclick="prestige(${pg})">🏡 Move house</button><h2>Skin shop</h2><div class=grid>${K.map(k=>`<div class=dc><div style="font-size:40px">${k[1]}</div><b>${k[2]}</b>${S.skins.includes(k[0])?"<small>✅ Owned</small>":`<button class=b onclick="buyskin('${k[0]}')">${k[3]} 🐾</button>`}</div>`).join("")}</div>`}
if(tab==3){h+='<h2>Training grounds</h2><p>Spend coins to make your dogs better. Each level adds +15%, up to level 5.</p><div class=grid>'+(S.dogs.length?S.dogs.map(d=>`<div class=dc><div class=sp style="height:72px"><div style="transform:scale(.75);transform-origin:top center">${sprite(d.k,d.sk,d.sh)}</div></div><b>${d.n}</b>${ST.map(s=>{const lv=(d.t||{})[s[0]]||0;return `<small>${s[1]} ${"▰".repeat(lv)}${"▱".repeat(5-lv)}</small><button class=b ${lv>=5?"disabled":""} onclick="train('${d.id}','${s[0]}')">${lv>=5?"MAX":s[2]+" · "+f(200*2**lv)+" 🪙"}</button>`}).join("")}</div>`).join(""):"<p>Adopt a dog first!</p>")+"</div>"}if(tab==4){h+=`<h2>Dog Vault (${S.v.length}/25)</h2><p>Stored dogs survive moving house and keep their ✨ shiny status, name and skin (levels and training reset). Tap 📦 on a dog card to store it.</p><div class=grid>${S.v.length?S.v.map(d=>`<div class=dc><div class=sp style="height:72px"><div style="transform:scale(.75);transform-origin:top center">${sprite(d.k,d.sk,d.sh)}</div></div><b>${d.n}</b><small>${d.sh?"✨ Shiny ":""}${B[d.k].n} · ${P[d.p][0]} ${P[d.p][1]}</small><small>Level ${d.l}</small><button class=b onclick="take('${d.id}')">Take out</button></div>`).join(""):"<p>Your vault is empty.</p>"}</div>`}
document.getElementById("app").innerHTML=h;hud();save()}
const spend=n=>S.coins>=n?(S.coins-=n,true):(toast("Not enough coins 🪙"),false);
function bone(n){if(spend(15*n)){S.bones+=n;render()}}
function room(i){if(spend(R[i][1])){S.rooms.push(i);render()}}
function adopt(i){const k=S.sh[i];if(!S.rooms.some(r=>S.dogs.filter(d=>d.r==r).length<3))return toast("No room! Unlock a new room 🏠");
if(!spend(B[k].$))return;const r=S.rooms.find(r=>S.dogs.filter(d=>d.r==r).length<3);
S.dogs.push({id:"d"+Math.random().toString(36).slice(2,8),k,n:document.getElementById("nm"+i).value.trim()||NM[Math.floor(Math.random()*NM.length)],p:document.getElementById("ps"+i).value,l:1,x:0,r,sk:"",pa:0,sh:Math.random()<.1});if(S.dogs[S.dogs.length-1].sh)toast("✨ WOW, a SHINY "+B[k].n+"! 2x coins!");else toast(B[k].n+" joined the family! 🐶");render()}
function pet(id){const d=S.dogs.find(x=>x.id==id);if(Date.now()-(d.pa||0)<(d.k=="pug"?4e3:1e4))return;d.pa=Date.now();
let a=d.l*mult(d)*tr(d,"b")*(d.k=="dac"?3:1)*(d.p=="playful"?2:1)*(d.k=="poo"?1.5:1)*(d.k=="hus"?0:1),lucky=d.k=="bea"&&Math.random()<.2;if(lucky)a*=5;
S.coins+=a;const s=document.createElement("span");s.className="fl";s.textContent=(lucky?"🍀 ":"❤️ ")+"+"+f(a);document.getElementById("h"+id).appendChild(s);setTimeout(()=>s.remove(),1000);hud();save()}
function feed(id){const d=S.dogs.find(x=>x.id==id);if(S.bones<1)return toast("No bones! Buy some in the Shop 🦴");
if(d.k=="gol"&&Math.random()<.5)toast("Goldie kept the bone! 🦴");else S.bones--;
d.x+=20*tr(d,"c")*(d.p=="hungry"?2:1)*(d.k=="dal"?2:1);
while(d.x>=d.l*40){d.x-=d.l*40;d.l++;const b=d.l*50*(d.k=="pom"?3:1);S.coins+=b;toast(`${d.n} reached level ${d.l}! +${f(b)} 🪙`)}render()}
function mv(id){const d=S.dogs.find(x=>x.id==id);const o=S.rooms.filter(r=>r!=d.r&&S.dogs.filter(x=>x.r==r).length<3);if(!o.length)return toast("No other room has space");d.r=o[0];render()}
function ren(id,v){const d=S.dogs.find(x=>x.id==id);d.n=v.trim()||d.n;render()}
function store(id){const i=S.dogs.findIndex(x=>x.id==id);if(S.v.length>=25)return toast("Vault is full (25)");S.v.push(S.dogs.splice(i,1)[0]);toast("Stored in the vault 📦");render()}
function take(id){const i=S.v.findIndex(x=>x.id==id);const r=S.rooms.find(r=>S.dogs.filter(d=>d.r==r).length<3);if(r===undefined)return toast("No room space! Unlock a room 🏠");const d=S.v.splice(i,1)[0];d.r=r;S.dogs.push(d);render()}
function train(id,k){const d=S.dogs.find(x=>x.id==id);d.t=d.t||{};const lv=d.t[k]||0;if(lv>=5)return;if(spend(200*2**lv)){d.t[k]=lv+1;render()}}
function skin(id,v){S.dogs.find(x=>x.id==id).sk=v;render()}
function buyskin(k){const c=K.find(x=>x[0]==k)[3];if(S.paws<c)return toast("Not enough paw prints 🐾");S.paws-=c;S.skins.push(k);render()}
function prestige(g){if(!window.cf){window.cf=1;toast("Tap again to move house (you lose dogs, rooms and coins)");setTimeout(()=>window.cf=0,4000);return}window.cf=0;const o=S;S=fresh();S.paws=o.paws+g;S.skins=o.skins;S.v=(o.v||[]).map(d=>({...d,l:1,x:0,t:{}}));S.pr=(o.pr||0)+1;starter();roll();tab=0;toast("Welcome to your new house! +"+g+" 🐾");render()}
setInterval(()=>{S.t++;if(S.t>=60){S.t=0;const a=S.dogs.reduce((s,d)=>s+pass(d),0);if(a>0){S.coins+=a;toast("Your pack earned "+f(a)+" 🪙")}save()}hud()},1000);
render();

const firebaseConfig={
  apiKey:"AIzaSyDQipiNhih4ZqWVh4Nz0LEPd7L_Tm-D_1I",
  authDomain:"cute-sleepy-games.firebaseapp.com",
  projectId:"cute-sleepy-games",
  storageBucket:"cute-sleepy-games.firebasestorage.app",
  messagingSenderId:"249264537283",
  appId:"1:249264537283:web:811dce511556eda6a96c76"
};
const REQUIRE_LOGIN=true; // true: visitors without the hub login go back to index.html
const app=getApps().length?getApp():initializeApp(firebaseConfig);
const auth=getAuth(app),db=getFirestore(app);
const badge=document.createElement("div");
badge.style.cssText="position:fixed;left:8px;bottom:8px;font:12px system-ui;background:#000b;color:#fff;padding:4px 10px;border-radius:12px;z-index:50;max-width:80vw";
document.body.appendChild(badge);
const say=t=>{badge.textContent=t};
let ready=false,busy=false,again=false,timer,lastXP=0;

async function saveGame(){
  const u=auth.currentUser;if(!u||!ready)return;
  if(busy){again=true;return}
  busy=true;
  try{
    const ref=doc(db,"saves",u.uid);
    const cur=(await getDoc(ref)).data()||{};
    let xp=cur.totalXP||0;const now=Date.now();
    if(now-lastXP>=60000){xp+=5;lastXP=now}
    await setDoc(ref,{doggySave:JSON.parse(JSON.stringify(S)),totalXP:xp,level:Math.floor(xp/500)+1},{merge:true});
    say("☁️ Saved");
  }catch(e){console.error(e);say("⚠️ Cloud save failed: "+(e.code||e.message))}
  finally{busy=false;if(again){again=false;window.cloudSave()}}
}
window.cloudSave=()=>{clearTimeout(timer);timer=setTimeout(saveGame,3000)};
addEventListener("pagehide",()=>{clearTimeout(timer);saveGame()});

onAuthStateChanged(auth,async user=>{
  if(!user){if(REQUIRE_LOGIN)location.href="index.html";else say("Not signed in: playing offline");return}
  say("☁️ Loading...");
  try{
    const snap=await getDoc(doc(db,"saves",user.uid));
    const d=snap.exists()&&snap.data().doggySave;
    if(d){S=d;S.v=S.v||[];S.pr=S.pr||0;S.sh=S.sh||[];if(!S.sh.length)roll();if(!S.dogs.length)starter()}
    ready=true;render();say("☁️ Connected");
  }catch(e){console.error(e);say("⚠️ Cloud load failed: "+(e.code||e.message))}
});
