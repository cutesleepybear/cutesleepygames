<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚪 Escape Room</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', Courier, monospace;
    background: #0a0a0a;
    color: #00ff41;
    min-height: 100vh; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
  }
  .back-btn { position: absolute; top: 20px; left: 20px; text-decoration: none; color: #555; font-size: 0.9rem; border: 1px solid #333; padding: 5px 10px; border-radius: 6px; font-family: sans-serif; z-index: 100; }
  .back-btn:hover { color: #00ff41; border-color: #00ff41; }
  
  #game-container { display: none; width: 100%; max-width: 800px; margin-top: 40px; }
  
  .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
  h1 { font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,255,65,0.5); }
  #timer { font-size: 1.2rem; color: #ff3333; font-weight: bold; }
  
  .subtitle { text-align: center; font-size: 0.8rem; color: #888; margin-bottom: 20px; font-family: sans-serif; }

  #log {
    background: #111; border: 1px solid #333; border-radius: 8px;
    padding: 20px; height: 350px; overflow-y: auto; font-size: 0.95rem;
    line-height: 1.6; margin-bottom: 20px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
  }
  .log-entry { margin-bottom: 10px; }
  .log-entry.sys { color: #00ff41; }
  .log-entry.room { color: #e0e0e0; }
  .log-entry.error { color: #ff3333; }
  .log-entry.win { color: #ffff00; font-weight: bold; font-size: 1.1rem; text-shadow: 0 0 10px #ffff00; }
  .log-entry.action { color: #00bfff; margin-top: 15px; }

  .inventory {
    background: #111; border: 1px solid #333; padding: 10px 20px; border-radius: 8px;
    margin-bottom: 20px; font-size: 0.9rem; display: flex; gap: 15px; flex-wrap: wrap;
  }
  .inventory span { color: #ffff00; }

  .input-area { display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1; padding: 12px; background: #000; border: 1px solid #333;
    color: #00ff41; font-family: inherit; font-size: 1rem; border-radius: 6px;
  }
  input[type="text"]:focus { outline: none; border-color: #00ff41; box-shadow: 0 0 10px rgba(0,255,65,0.3); }
  
  button {
    padding: 12px 24px; background: #00ff41; color: #000; border: none;
    font-weight: bold; font-family: inherit; font-size: 1rem; border-radius: 6px; cursor: pointer;
    transition: all 0.2s;
  }
  button:hover { background: #fff; box-shadow: 0 0 15px #fff; }

  #win-screen {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
    flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 1000;
  }
  #win-screen h2 { font-size: 3rem; color: #ffff00; text-shadow: 0 0 20px #ffff00; margin-bottom: 20px; }
  #win-screen p { color: #ccc; margin-bottom: 30px; font-family: sans-serif; }
</style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back to Hub</a>

  <div id="game-container">
    <div class="header">
      <h1 id="room-title">Loading...</h1>
      <div id="timer">00:00</div>
    </div>
    <div class="subtitle">Commands: look, inventory, examine [object], use [code]</div>

    <div id="log"></div>
    <div class="inventory" id="inventory">
      Inventory: <span id="inv-items">Empty</span>
    </div>

    <div class="input-area">
      <input type="text" id="command-input" placeholder="Type a command..." autocomplete="off" autofocus>
      <button onclick="processCommand()">Enter</button>
    </div>
  </div>

  <div id="win-screen">
    <h2>YOU ESCAPED!</h2>
    <p id="win-sub">Your stats have been saved to the cloud.</p>
    <button onclick="window.location.reload()" style="padding: 15px 30px; font-size: 1.2rem;">Play Again</button>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDQipiNhih4ZqWVh4Nz0LEPd7L_Tm-D_1I", 
    authDomain: "cute-sleepy-games.firebaseapp.com",
    projectId: "cute-sleepy-games",
    storageBucket: "cute-sleepy-games.firebasestorage.app",
    messagingSenderId: "249264537283",
    appId: "1:249264537283:web:811dce511556eda6a96c76"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let state = {
    currentRoom: null,
    inventory: [],
    startTime: null,
    timerInterval: null,
    escaped: false
  };

  // ============ RANDOM GENERATION DATA ============
  const ROOM_TYPES = [
    {
      title: "The Study",
      intro: "You wake up in a dusty study. The door is locked, and a computer blinks on the desk.",
      targets: ["bookshelf", "desk", "painting", "fireplace"],
      winMsg: "The screen flashes green. 'ACCESS GRANTED'. The door clicks open!",
      codePrompt: "The screen says: 'ENTER PASSWORD'."
    },
    {
      title: "The Vault",
      intro: "You are trapped in a bank vault. A heavy metal door stands before you.",
      targets: ["guard's desk", "vent", "toolbox", "filing cabinet"],
      winMsg: "CLUNK. The vault door swings open!",
      codePrompt: "The safe says: 'ENTER 3-DIGIT CODE'."
    },
    {
      title: "The Cellar",
      intro: "It's dark and damp. You see a locked wooden door.",
      targets: ["crates", "wine rack", "pile of bones", "drain", "shelf"],
      winMsg: "The heavy lock falls off. You escape the cellar!",
      codePrompt: "The door has a 3-digit combination lock."
    },
    {
      title: "The Lab",
      intro: "You're in a sterile laboratory. The exit door requires a keycard code.",
      targets: ["microscope", "fume hood", "computer", "trash can", "cabinet"],
      winMsg: "The door hisses open. You step into the hallway.",
      codePrompt: "A digital pad blinks: 'ENTER CODE'."
    }
  ];

  const HIDING_SPOTS = [
    "You search it and find a sticky note that says: 'Code: {CODE}'.",
    "Taped underneath, you find a note: 'The code is {CODE}'.",
    "Inside, someone scratched the numbers {CODE} into the wood.",
    "You shake it and a piece of paper falls out. It says '{CODE}'.",
    "Hidden in a false bottom, you find: '{CODE}'."
  ];

  window.playerStats = { escapes: 0 };

  // ============ LOGGING & UI ============
  function log(msg, type = 'room') {
    const el = document.getElementById('log');
    const div = document.createElement('div');
    div.className = `log-entry ${type}`;
    div.innerText = msg;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
  }

  function updateInventory() {
    const el = document.getElementById('inv-items');
    el.innerText = state.inventory.length === 0 ? "Empty" : state.inventory.join(', ');
  }

  function startTimer() {
    state.startTime = Date.now();
    state.timerInterval = setInterval(() => {
      const diff = Math.floor((Date.now() - state.startTime) / 1000);
      const mins = String(Math.floor(diff / 60)).padStart(2, '0');
      const secs = String(diff % 60).padStart(2, '0');
      document.getElementById('timer').innerText = `${mins}:${secs}`;
    }, 1000);
  }

  // ============ PROCEDURAL GENERATION ============
  function startGame() {
    document.getElementById('game-container').style.display = 'block';
    
    // 1. Pick a random room type
    const baseRoom = ROOM_TYPES[Math.floor(Math.random() * ROOM_TYPES.length)];
    
    // 2. Generate a RANDOM 3-digit code (100-999)
    const code = String(Math.floor(Math.random() * 900) + 100);
    
    // 3. Pick which object hides the code
    const clueTarget = baseRoom.targets[Math.floor(Math.random() * baseRoom.targets.length)];
    
    // 4. Pick the text for the hidden clue
    const clueText = HIDING_SPOTS[Math.floor(Math.random() * HIDING_SPOTS.length)].replace("{CODE}", code);

    // 5. Create the dynamic room object
    state.currentRoom = {
      title: baseRoom.title,
      intro: baseRoom.intro,
      code: code,
      winMsg: baseRoom.winMsg,
      codePrompt: baseRoom.codePrompt,
      targets: baseRoom.targets,
      clueTarget: clueTarget,
      clueText: clueText
    };

    document.getElementById('room-title').innerText = state.currentRoom.title;

    log(state.currentRoom.intro, "sys");
    log(`You look around and see: ${state.currentRoom.targets.join(', ')}.`, "room");
    log("Type 'examine [object]' to investigate.", "sys");
    
    startTimer();
  }

  // ============ COMMAND PARSER ============
  function processCommand() {
    if (state.escaped) return;

    const input = document.getElementById('command-input');
    const cmd = input.value.toLowerCase().trim();
    input.value = '';
    if (!cmd) return;

    log(`> ${cmd}`, 'action');
    const words = cmd.split(' ');
    const room = state.currentRoom;

    // 1. Looking around
    if (cmd === 'look' || cmd === 'l') {
      log("You look around the room:", "sys");
      room.targets.forEach(item => log(`- ${item}`, "room"));
    } 
    
    // 2. Inventory
    else if (cmd === 'inventory' || cmd === 'i') {
      log(`You are carrying: ${state.inventory.length ? state.inventory.join(', ') : 'nothing'}`, 'sys');
    } 
    
    // 3. Examining objects
    else if (words[0] === 'examine' || words[0] === 'search' || words[0] === 'check') {
      const obj = words.slice(1).join(' ');
      
      // Did they examine the clue object?
      if (room.targets.some(t => obj.includes(t) || t.includes(obj))) {
        if (obj.includes(room.clueTarget) || room.clueTarget.includes(obj)) {
          log(room.clueText, "room"); // Reveal the code!
        } else {
          log("You look closely, but there's nothing useful here.", "room");
        }
      } else {
        log("I don't see that in this room.", "error");
      }
    } 
    
    // 4. Entering the code
    else if (words[0] === 'use' || words[0] === 'code' || words[0] === 'enter') {
      const attemptedCode = words[words.length - 1];
      
      if (attemptedCode === room.code) {
        winGame();
      } else if (cmd.includes(room.code)) {
        winGame();
      } else {
        log("The lock flashes red. Incorrect code.", "error");
      }
    } 
    
    // 5. Help
    else if (cmd === 'help') {
      log("Commands: look, inventory, examine [object], code [number]", "sys");
    } 
    
    // 6. Secret shortcut: just typing the code works
    else if (cmd === room.code) {
      winGame();
    } 
    
    // 7. Fallback
    else {
      log("I don't understand that command. Type 'help' for a list.", "error");
    }
  }

  async function winGame() {
    state.escaped = true;
    clearInterval(state.timerInterval);
    log(state.currentRoom.winMsg, "win");
    
    window.playerStats.escapes++;
    
    // Save to Firebase
    if (auth.currentUser) {
      const docRef = doc(db, "saves", auth.currentUser.uid);
      const docSnap = await getDoc(docRef);
      
      let currentData = {};
      if (docSnap.exists()) {
        currentData = docSnap.data();
      }
      
      currentData.escapeRoomWins = (currentData.escapeRoomWins || 0) + 1;
      await setDoc(docRef, currentData);
    }

    setTimeout(() => {
      document.getElementById('win-screen').style.display = 'flex';
    }, 1500);
  }

  // Allow pressing "Enter" to submit
  document.getElementById('command-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') processCommand();
  });

  // ============ CHECK LOGIN ============
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      startGame();
    } else {
      window.location.href = "index.html";
    }
  });
</script>
</body>
</html>
