function score(ch){const w=SL.filter(s=>S.outfit[s]).map(s=>({s,it:IT[S.outfit[s].id],c:S.outfit[s].c})),n=w.length;
let th=Math.min(35,w.filter(x=>x.it.st.some(t=>ch.st.includes(t))).length/n*38);th=Math.max(0,th-ch.rq.filter(r=>!S.outfit[r]).length*5);

const rc=w.filter(x=>x.c.toLowerCase()!=x.it.col.toLowerCase()).length,cr=Math.min(10,Math.min(6,rc*2)+Math.min(4,Object.keys(tags).length-1));
const r=[th,co,sy,ac,cr].map(Math.round);return{r,t:Math.min(100,r.reduce((a,b)=>a+b,0)),sig:w.map(x=>x.it.id+x.c).join()}}
