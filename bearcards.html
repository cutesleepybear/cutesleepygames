<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐻 Bear Cards</title>

<!-- ============ FIREBASE SETUP ============ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  // ADDED: The missing imports!
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // YOUR CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDQipiNhih4ZqWVh4Nz0LEPd7L_Tm-D_1I",
  authDomain: "cute-sleepy-games.firebaseapp.com",
  projectId: "cute-sleepy-games",
  storageBucket: "cute-sleepy-games.firebasestorage.app",
  messagingSenderId: "249264537283",
  appId: "1:249264537283:web:811dce511556eda6a96c76"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Make them global so the main script can use them
  window.firebaseAuth = auth;
  window.firebaseDb = db;
  window.fbSignIn = signInWithEmailAndPassword;
  window.fbSignUp = createUserWithEmailAndPassword;
  window.fbOnAuth = onAuthStateChanged;
  window.fbDoc = doc;
  window.fbGetDoc = getDoc;
  window.fbSetDoc = setDoc; // ADDED: Needed for saving
</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at 50% 0%, #2d4a2d, #1a2e1a 60%, #0f1a0f);
    color: #f0e6d2; min-height: 100vh; padding: 16px;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 1.6rem; margin-bottom: 4px; letter-spacing: 1px; }
  .subtitle { font-size: 0.8rem; color: #9ab89a; margin-bottom: 16px; }
  .arena { width: 100%; max-width: 960px; display: grid; gap: 12px; }
  .side { display: flex; flex-direction: column; gap: 8px; }
  .side-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #9ab89a; padding-left: 4px; }
  .team { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .card {
    width: 150px; background: linear-gradient(160deg, #3a2f1f, #2a2115);
    border: 2px solid #5a4a2f; border-radius: 12px; padding: 10px;
    text-align: center; position: relative;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .card.active { border-color: #f0c060; box-shadow: 0 0 18px rgba(240,192,96,0.5); transform: translateY(-4px); }
  .card.ko { opacity: 0.35; filter: grayscale(1); }
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { border-color: #f0c060; transform: translateY(-3px); }
  .emoji { font-size: 2.6rem; line-height: 1; }
  .name { font-size: 0.82rem; font-weight: 600; margin: 4px 0 2px; }
  .type-tag { display: inline-block; font-size: 0.62rem; padding: 1px 6px; border-radius: 8px; background: #5a4a2f; color: #f0e6d2; margin-bottom: 6px; }
  .hpbar { height: 8px; background: #1a1408; border-radius: 4px; overflow: hidden; margin: 4px 0 2px; }
  .hpfill { height: 100%; background: linear-gradient(90deg, #4caf50, #8bc34a); transition: width 0.4s; }
  .hpfill.low { background: linear-gradient(90deg, #d32f2f, #ff7043); }
  .hptext { font-size: 0.68rem; color: #c9b98f; }
  .atk { font-size: 0.68rem; color: #e0a050; margin-top: 2px; }
  .ability { font-size: 0.6rem; color: #8aa88a; margin-top: 3px; font-style: italic; }
  .status { font-size: 0.58rem; color: #ff8a65; margin-top: 2px; min-height: 10px; }
  .divider { text-align: center; font-size: 0.7rem; letter-spacing: 3px; color: #5a7a5a; text-transform: uppercase; padding: 2px 0; }
  .log { background: rgba(0,0,0,0.4); border: 1px solid #3a4a3a; border-radius: 10px; padding: 10px 12px; height: 110px; overflow-y: auto; font-size: 0.78rem; line-height: 1.5; }
  .log p { margin: 1px 0; }
  .log .you { color: #8bc34a; }
  .log .cpu { color: #ff8a65; }
  .log .sys { color: #c9b98f; font-style: italic; }
  .log .big { color: #f0c060; font-weight: bold; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; min-height: 44px; }
  button {
    font-family: inherit; font-size: 0.82rem; padding: 9px 16px;
    background: linear-gradient(160deg, #4a6a3a, #35502a); color: #f0e6d2;
    border: 1px solid #6a8a4a; border-radius: 8px; cursor: pointer; transition: all 0.15s;
  }
  button:hover:not(:disabled) { background: linear-gradient(160deg, #5a7a4a, #45603a); transform: translateY(-1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.attack { background: linear-gradient(160deg, #8a3a2a, #6a2a1a); border-color: #aa5a3a; }
  button.attack:hover:not(:disabled) { background: linear-gradient(160deg, #aa4a3a, #8a3a2a); }
  .items { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .item {
    width: 120px; background: linear-gradient(160deg, #4a3a1f, #332814);
    border: 1px solid #7a5a2f; border-radius: 10px; padding: 8px;
    text-align: center; cursor: pointer; transition: all 0.15s; font-size: 0.7rem;
  }
  .item:hover:not(.used) { border-color: #f0c060; transform: translateY(-2px); }
  .item.used { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }
  .item .iemoji { font-size: 1.4rem; }
  .turn-banner { text-align: center; font-size: 0.9rem; font-weight: 600; color: #f0c060; min-height: 22px; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; padding: 20px; }
  .overlay h2 { font-size: 2rem; margin-bottom: 8px; }
  .overlay p { color: #c9b98f; margin-bottom: 20px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" style="position: fixed; inset: 0; background: radial-gradient(circle at 50% 0%, #2d4a2d, #1a2e1a 60%, #0f1a0f); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #f0e6d2; font-family: 'Segoe UI', system-ui, sans-serif;">
    <h2 style="font-size: 2rem; margin-bottom: 20px;">🐻 Bear Ranger Login</h2>
    <div style="background: #2a2115; padding: 30px; border-radius: 12px; border: 2px solid #5a4a2f; width: 300px; text-align: center;">
      <input type="email" id="login-email" placeholder="Email" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #5a4a2f; background: #1a1408; color: white;">
      <input type="password" id="login-pass" placeholder="Password" style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 6px; border: 1px solid #5a4a2f; background: #1a1408; color: white;">
      <button id="btn-login" style="width: 100%; margin-bottom: 10px; padding: 10px; cursor: pointer;">Log In</button>
      <button id="btn-signup" style="width: 100%; padding: 10px; cursor: pointer; background: #35502a; border-color: #6a8a4a;">Sign Up</button>
      <p id="login-msg" style="color: #ff8a65; font-size: 0.8rem; margin-top: 15px; min-height: 20px;"></p>
    </div>
  </div>

  <!-- GAME CONTAINER -->
  <div id="game-container" style="display: none; width: 100%; flex-direction: column; align-items: center;">
    
    <h1>🐻 BEAR CARDS 🐻</h1>
    <div class="subtitle">Defeat all 3 of the rival ranger's bears</div>
    
    <!-- WIN/LOSS TRACKER -->
    <div id="record-display" style="font-size: 0.9rem; color: #f0c060; margin-bottom: 16px; font-weight: bold; text-align: center;">
      Wins: 0 | Losses: 0
    </div>

    <div class="arena">
      <div class="side">
        <div class="side-label">Rival Ranger</div>
        <div class="team" id="cpu-team"></div>
      </div>
      <div class="divider">— battlefield —</div>
      <div class="side">
        <div class="team" id="player-team"></div>
        <div class="side-label">Your Bears</div>
      </div>
      <div class="turn-banner" id="turn-banner"></div>
      <div class="log" id="log"></div>
      <div class="items" id="items"></div>
      <div class="actions" id="actions"></div>
    </div>

    <div class="overlay hidden" id="overlay">
      <h2 id="over-title"></h2>
      <p id="over-sub"></p>
      <button onclick="initGame()">Play Again</button>
    </div>

  </div> <!-- END GAME CONTAINER -->

<script>
// ============ BEAR DATA ============
const BEARS = [
  { id:'brown',   emoji:'🐻',  name:'Brown Bear',     type:'Forest',      hp:100, atk:30, ability:'Forage',        abilDesc:'Heals 10 HP each turn' },
  { id:'panda',   emoji:'🐼',  name:'Panda',          type:'Bamboo',      hp:110, atk:25, ability:'Bamboo Shield', abilDesc:'Takes 10 less damage' },
  { id:'polar',   emoji:'🐻‍❄️', name:'Polar Bear',     type:'Ice',         hp:120, atk:35, ability:'Frostbite',     abilDesc:'25% chance to freeze' },
  { id:'honey',   emoji:'🦡',  name:'Honey Badger',   type:'Chaos',       hp:90,  atk:40, ability:'Fearless',      abilDesc:'Ignores type disadvantage' },
  { id:'koala',   emoji:'🐨',  name:'Koala',          type:'Eucalyptus',  hp:95,  atk:20, ability:'Nap',           abilDesc:'Heals 15 HP on swap-in' },
  { id:'specs',   emoji:'🐻',  name:'Spectacled',     type:'Cloud Forest',hp:105, atk:30, ability:'Climb',         abilDesc:'25% chance to dodge' },
  { id:'teddy',   emoji:'🧸',  name:'Teddy Bear',     type:'Dream',       hp:80,  atk:15, ability:'Cuddle',        abilDesc:'Weakens foe -10 atk' },
  { id:'grizzly', emoji:'🐻',  name:'Grizzly',        type:'Mountain',    hp:130, atk:40, ability:'Maul',          abilDesc:'+15 dmg, 8 recoil' },
  { id:'redpanda', emoji:'🦊', name:'Red Panda',      type:'Bamboo',      hp:85,  atk:25, ability:'Tail Balance',  abilDesc:'20% chance to dodge' },
  { id:'sloth',    emoji:'🐻', name:'Sloth Bear',     type:'Forest',      hp:105, atk:32, ability:'Shaggy Coat',   abilDesc:'Takes 5 less damage' },
  { id:'sun',      emoji:'🐻', name:'Sun Bear',       type:'Jungle',      hp:90,  atk:30, ability:'Honey Tongue',  abilDesc:'Heals 8 HP on hit' },
  { id:'moon',     emoji:'🐻', name:'Moon Bear',      type:'Mountain',    hp:115, atk:30, ability:'Crescent Mark', abilDesc:'+10 dmg below half HP' },
  { id:'ember',   emoji:'🔥',  name:'Ember Bear',     type:'Flame',       hp:100, atk:35, ability:'Ignite',        abilDesc:'20% chance to burn' },
  { id:'tide',    emoji:'🌊',  name:'Tide Bear',      type:'Water',       hp:110, atk:28, ability:'Undertow',      abilDesc:'Heals 10 on attack' },
  { id:'storm',   emoji:'⚡',  name:'Storm Bear',     type:'Storm',       hp:95,  atk:38, ability:'Chain Zap',     abilDesc:'15% chance to stun' },
  { id:'lunar',   emoji:'🌙',  name:'Lunar Bear',     type:'Dream',       hp:100, atk:25, ability:'Moonlight',     abilDesc:'Heals 12 HP each turn' },
  { id:'bone',    emoji:'💀',  name:'Bone Bear',      type:'Chaos',       hp:85,  atk:42, ability:'Reckless',      abilDesc:'Takes 10 recoil on attack' },
  { id:'moss',    emoji:'🌿',  name:'Moss Bear',      type:'Forest',      hp:130, atk:22, ability:'Regrowth',      abilDesc:'Heals 15 on swap-in' },
  { id:'frost',   emoji:'❄️',  name:'Frost Grizzly',  type:'Ice',         hp:125, atk:36, ability:'Deep Freeze',   abilDesc:'30% chance to freeze' },
  { id:'dragon',  emoji:'🐉',  name:'Dragon Bear',    type:'Mythic',      hp:140, atk:45, ability:'Ancient Roar',  abilDesc:'+10 dmg, 15 recoil' },
  { id:'ghost',   emoji:'👻',  name:'Ghost Bear',     type:'Dream',       hp:90,  atk:30, ability:'Phase',         abilDesc:'30% chance to dodge' },
  { id:'spore',   emoji:'🍄',  name:'Spore Bear',     type:'Forest',      hp:100, atk:26, ability:'Spore Cloud',   abilDesc:'Poisons attacker' },
  { id:'crystal', emoji:'💎',  name:'Crystal Bear',   type:'Mountain',    hp:120, atk:28, ability:'Prism',         abilDesc:'+8 extra type advantage' },
  { id:'shadow',  emoji:'🖤',  name:'Shadow Bear',    type:'Chaos',       hp:95,  atk:34, ability:'Ambush',        abilDesc:'+15 dmg on first hit' },
  { id:'blossom', emoji:'🌸',  name:'Blossom Bear',   type:'Bamboo',      hp:105, atk:24, ability:'Petal Guard',   abilDesc:'Heals 10 when hit' },
  { id:'thunder', emoji:'🌩️',  name:'Thunder Bear',   type:'Storm',       hp:110, atk:36, ability:'Overcharge',    abilDesc:'+5 dmg stacking per attack (max +20)' },
];

const ADVANTAGE = {
  'Forest':      ['Mountain','Bamboo','Water'],
  'Mountain':    ['Ice','Cloud Forest','Flame'],
  'Ice':         ['Forest','Eucalyptus','Water'],
  'Bamboo':      ['Dream','Water'],
  'Dream':       ['Chaos','Storm'],
  'Cloud Forest':['Eucalyptus','Bamboo'],
  'Eucalyptus':  ['Forest','Water'],
  'Flame':       ['Ice','Forest','Bamboo'],
  'Water':       ['Flame','Mountain'],
  'Storm':       ['Water','Ice'],
  'Jungle':      ['Bamboo','Forest'],
  'Mythic':      ['Dragon','Flame','Storm','Ice','Mountain','Forest','Bamboo','Water','Dream','Chaos','Jungle','Cloud Forest','Eucalyptus'],
  'Chaos':       [],
};

const ITEMS = [
  { id:'honey',  emoji:'🍯', name:'Honey Jar',    desc:'Heal 25 HP',            used:false },
  { id:'salmon', emoji:'🐟', name:'Salmon Snack', desc:'+15 atk next attack',   used:false },
  { id:'log',    emoji:'🪵', name:'Log Trap',     desc:'Enemy skips next turn', used:false },
];

let state = {};
let playerStats = { wins: 0, losses: 0 };

function makeBear(base) {
  return {
    ...base, maxHp: base.hp, alive: true, bonusAtk: 0,
    frozenTurns: 0, cuddleOnMe: 0, burnTurns: 0, poisonTurns: 0,
    stunnedTurns: 0, overchargeStacks: 0, firstHitDone: false,
  };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickTeam() {
  return shuffle(BEARS).slice(0, 3).map(makeBear);
}

function initGame() {
  state = {
    player: { team: pickTeam(), active: 0, items: ITEMS.map(i=>({...i})) },
    cpu:    { team: pickTeam(), active: 0, items: [] },
    turn: 'player',
    over: false,
    cpuSkip: false,
  };
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('log').innerHTML = '';
  log('A wild rival ranger appears!', 'big');
  log('Your team: ' + state.player.team.map(b=>b.name).join(', '), 'sys');
  log('Rival team: ' + state.cpu.team.map(b=>b.name).join(', '), 'sys');
  render();
  setBanner('Your turn — choose an action');
}

function log(msg, cls='') {
  const el = document.getElementById('log');
  const p = document.createElement('p');
  p.className = cls; p.textContent = msg;
  el.appendChild(p); el.scrollTop = el.scrollHeight;
}

function render() {
  renderTeam('cpu-team', state.cpu, false);
  renderTeam('player-team', state.player, true);
  renderItems();
  renderActions();
}

function statusText(bear) {
  const parts = [];
  if (bear.burnTurns > 0) parts.push('🔥burn');
  if (bear.poisonTurns > 0) parts.push('☠️poison');
  if (bear.frozenTurns > 0) parts.push('❄️frozen');
  if (bear.stunnedTurns > 0) parts.push('⚡stun');
  return parts.join(' ');
}

function renderTeam(containerId, side, clickable) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  side.team.forEach((bear, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    if (idx === side.active) card.classList.add('active');
    if (!bear.alive) card.classList.add('ko');
    if (clickable && bear.alive && idx !== side.active && state.turn === 'player' && !state.over) {
      card.classList.add('clickable');
      card.onclick = () => swapToPlayer(idx);
    }
    const hpPct = Math.max(0, bear.hp / bear.maxHp * 100);
    card.innerHTML = `
      <div class="emoji">${bear.emoji}</div>
      <div class="name">${bear.name}</div>
      <div class="type-tag">${bear.type}</div>
      <div class="hpbar"><div class="hpfill ${hpPct < 30 ? 'low' : ''}" style="width:${hpPct}%"></div></div>
      <div class="hptext">${Math.max(0,Math.round(bear.hp))} / ${bear.maxHp} HP</div>
      <div class="atk">⚔ ${bear.atk}${bear.bonusAtk ? ` (+${bear.bonusAtk})` : ''}</div>
      <div class="ability">${bear.ability}</div>
      <div class="status">${statusText(bear)}</div>
    `;
    el.appendChild(card);
  });
}

function renderItems() {
  const el = document.getElementById('items');
  el.innerHTML = '';
  if (state.turn !== 'player' || state.over) return;
  state.player.items.forEach((item) => {
    const div = document.createElement('div');
    div.className = 'item' + (item.used ? ' used' : '');
    div.innerHTML = `<div class="iemoji">${item.emoji}</div><div>${item.name}</div><div style="color:#9ab89a;font-size:0.6rem">${item.desc}</div>`;
    if (!item.used) div.onclick = () => useItem(item);
    el.appendChild(div);
  });
}

function renderActions() {
  const el = document.getElementById('actions');
  el.innerHTML = '';
  if (state.turn !== 'player' || state.over) return;
  const atkBtn = document.createElement('button');
  atkBtn.className = 'attack';
  atkBtn.textContent = '⚔ Attack';
  atkBtn.onclick = () => playerAttack();
  el.appendChild(atkBtn);
  const hint = document.createElement('button');
  hint.textContent = '🔄 Swap (click a bear)';
  hint.disabled = true;
  el.appendChild(hint);
}

function setBanner(text) { document.getElementById('turn-banner').textContent = text; }

function typeBonus(attacker, defender) {
  if (attacker.type === 'Chaos') return 0;
  const list = ADVANTAGE[attacker.type] || [];
  if (!list.includes(defender.type)) return 0;
  if (attacker.ability === 'Prism') return 18;
  return 10;
}

function calcDamage(attacker, defender) {
  let dmg = attacker.atk + attacker.bonusAtk;
  if (attacker.ability === 'Maul') dmg += 15;
  if (attacker.ability === 'Ancient Roar') dmg += 10;
  if (attacker.ability === 'Crescent Mark' && attacker.hp < attacker.maxHp / 2) dmg += 10;
  if (attacker.ability === 'Overcharge') dmg += attacker.overchargeStacks;
  if (attacker.ability === 'Ambush' && !attacker.firstHitDone) dmg += 15;
  dmg += typeBonus(attacker, defender);
  if (defender.ability === 'Bamboo Shield') dmg -= 10;
  if (defender.ability === 'Shaggy Coat') dmg -= 5;
  if (attacker.cuddleOnMe > 0) { dmg -= attacker.cuddleOnMe; attacker.cuddleOnMe = 0; }
  return Math.max(1, Math.round(dmg));
}

function dodgeChance(bear) {
  if (bear.ability === 'Climb') return 0.25;
  if (bear.ability === 'Tail Balance') return 0.20;
  if (bear.ability === 'Phase') return 0.30;
  return 0;
}

function applyHit(targetSide, targetIdx, dmg) {
  const bear = targetSide.team[targetIdx];
  const dc = dodgeChance(bear);
  if (dc > 0 && Math.random() < dc) {
    log(`${bear.name} dodges the attack! (${bear.ability})`, 'sys');
    return { dodged: true };
  }
  bear.hp -= dmg;
  if (bear.ability === 'Petal Guard' && bear.hp > 0) {
    bear.hp = Math.min(bear.maxHp, bear.hp + 10);
    log(`${bear.name} blooms and heals 10 HP (Petal Guard)`, 'sys');
  }
  if (bear.hp <= 0) {
    bear.hp = 0; bear.alive = false;
    log(`${bear.name} is knocked out! 💥`, 'big');
    if (targetSide.active === targetIdx) {
      const next = targetSide.team.findIndex((b, i) => b.alive && i !== targetIdx);
      if (next !== -1) {
        targetSide.active = next;
        const nb = targetSide.team[next];
        log(`${nb.name} steps in!`, 'sys');
        applySwapInHeal(nb);
      }
    }
  }
  return { dodged: false, dmg };
}

function applySwapInHeal(bear) {
  if (bear.ability === 'Nap') {
    bear.hp = Math.min(bear.maxHp, bear.hp + 15);
    log(`${bear.name} naps and recovers 15 HP (Nap)`, 'sys');
  }
  if (bear.ability === 'Regrowth') {
    bear.hp = Math.min(bear.maxHp, bear.hp + 15);
    log(`${bear.name} regrows and recovers 15 HP (Regrowth)`, 'sys');
  }
}

function doAttack(attackerSide, defenderSide, attackerName, defenderName) {
  const atkBear = attackerSide.team[attackerSide.active];
  const defBear = defenderSide.team[defenderSide.active];
  if (!atkBear.alive || !defBear.alive) return;

  if (atkBear.stunnedTurns > 0) {
    atkBear.stunnedTurns--;
    log(`${atkBear.name} is stunned and can't attack! ⚡`, 'sys');
    return;
  }

  const cls = attackerSide === state.player ? 'you' : 'cpu';
  const dmg = calcDamage(atkBear, defBear);
  const tb = typeBonus(atkBear, defBear);
  const typeNote = tb ? ` (type +${tb})` : '';
  log(`${attackerName}'s ${atkBear.name} attacks ${defenderName}'s ${defBear.name} for ${dmg} dmg${typeNote}`, cls);
  applyHit(defenderSide, defenderSide.active, dmg, atkBear);

  if (atkBear.ability === 'Honey Tongue') {
    atkBear.hp = Math.min(atkBear.maxHp, atkBear.hp + 8);
    log(`${atkBear.name} licks honey and heals 8 HP`, 'sys');
  }
  if (atkBear.ability === 'Undertow') {
    atkBear.hp = Math.min(atkBear.maxHp, atkBear.hp + 10);
    log(`${atkBear.name} rides the undertow and heals 10 HP`, 'sys');
  }
  const recoils = { 'Reckless':10, 'Ancient Roar':15, 'Maul':8 };
  if (recoils[atkBear.ability]) {
    atkBear.hp = Math.max(0, atkBear.hp - recoils[atkBear.ability]);
    log(`${atkBear.name} takes ${recoils[atkBear.ability]} recoil (${atkBear.ability})`, 'sys');
    if (atkBear.hp <= 0) { atkBear.alive = false; log(`${atkBear.name} collapses!`, 'big'); }
  }
  if (atkBear.ability === 'Overcharge') {
    atkBear.overchargeStacks = Math.min(20, atkBear.overchargeStacks + 5);
  }
  if (atkBear.ability === 'Ambush') atkBear.firstHitDone = true;

  atkBear.bonusAtk = 0;

  if (defBear.alive) {
    if (atkBear.ability === 'Ignite' && Math.random() < 0.20) {
      defBear.burnTurns = 3;
      log(`${defBear.name} is burning! 🔥`, 'sys');
    }
    if (atkBear.ability === 'Chain Zap' && Math.random() < 0.15) {
      defBear.stunnedTurns = 1;
      log(`${defBear.name} is stunned! ⚡`, 'sys');
    }
    if (atkBear.ability === 'Spore Cloud') {
      defBear.poisonTurns = 2;
      log(`${defBear.name} is poisoned! ☠️`, 'sys');
    }
    if (atkBear.ability === 'Frostbite' && Math.random() < 0.25) {
      defBear.frozenTurns = 1;
      log(`${defBear.name} is frozen! ❄️`, 'sys');
    }
    if (atkBear.ability === 'Deep Freeze' && Math.random() < 0.30) {
      defBear.frozenTurns = 1;
      log(`${defBear.name} is frozen solid! ❄️`, 'sys');
    }
    if (atkBear.ability === 'Cuddle') {
      defBear.cuddleOnMe = 10;
      log(`${defBear.name} is weakened by cuteness (-10 next attack)`, 'sys');
    }
  }

  checkWin();
}

function playerAttack() {
  if (state.turn !== 'player' || state.over) return;
  doAttack(state.player, state.cpu, 'You', 'Rival');
  if (state.over) return;
  endPlayerTurn();
}

function swapToPlayer(idx) {
  if (state.turn !== 'player' || state.over) return;
  if (idx === state.player.active) return;
  const bear = state.player.team[idx];
  if (!bear.alive) return;
  state.player.active = idx;
  log(`You swap in ${bear.name}!`, 'you');
  applySwapInHeal(bear);
  endPlayerTurn();
}

function useItem(item) {
  if (state.turn !== 'player' || state.over || item.used) return;
  item.used = true;
  const myBear = state.player.team[state.player.active];
  if (item.id === 'honey') {
    myBear.hp = Math.min(myBear.maxHp, myBear.hp + 25);
    log(`You use 🍯 Honey Jar — ${myBear.name} heals 25 HP`, 'you');
  } else if (item.id === 'salmon') {
    myBear.bonusAtk += 15;
    log(`You use 🐟 Salmon Snack — ${myBear.name} gains +15 attack next hit`, 'you');
  } else if (item.id === 'log') {
    state.cpuSkip = true;
    log(`You set a 🪵 Log Trap — the rival will skip next turn!`, 'you');
  }
  render();
  endPlayerTurn();
}

function tickStatuses(side, sideName) {
  side.team.forEach(bear => {
    if (!bear.alive) return;
    if (bear.burnTurns > 0) {
      bear.burnTurns--;
      bear.hp = Math.max(0, bear.hp - 5);
      log(`${sideName}'s ${bear.name} burns for 5 HP`, 'sys');
      if (bear.hp <= 0) { bear.alive = false; log(`${bear.name} burns out!`, 'big'); }
    }
    if (bear.poisonTurns > 0) {
      bear.poisonTurns--;
      bear.hp = Math.max(0, bear.hp - 4);
      log(`${sideName}'s ${bear.name} takes 4 poison dmg`, 'sys');
      if (bear.hp <= 0) { bear.alive = false; log(`${bear.name} succumbs to poison!`, 'big'); }
    }
  });
  if (!side.team[side.active].alive) {
    const next = side.team.findIndex(b => b.alive);
    if (next !== -1) {
      side.active = next;
      log(`${side.team[next].name} steps in!`, 'sys');
      applySwapInHeal(side.team[next]);
    }
  }
}

function passiveTurnHeal(side, sideName) {
  const bear = side.team[side.active];
  if (!bear || !bear.alive) return;
  if (bear.ability === 'Forage') {
    bear.hp = Math.min(bear.maxHp, bear.hp + 10);
    log(`${sideName}'s ${bear.name} forages and heals 10 HP`, 'sys');
  }
  if (bear.ability === 'Moonlight') {
    bear.hp = Math.min(bear.maxHp, bear.hp + 12);
    log(`${sideName}'s ${bear.name} bathes in moonlight and heals 12 HP`, 'sys');
  }
}

function endPlayerTurn() {
  if (checkWin()) return;
  render();
  tickStatuses(state.player, 'Your');
  passiveTurnHeal(state.player, 'Your');
  if (checkWin()) { render(); return; }
  render();
  state.turn = 'cpu';
  setBanner('Rival is thinking...');
  render();
  setTimeout(cpuTurn, 900);
}

function cpuTurn() {
  if (state.over) return;
  tickStatuses(state.cpu, "Rival's");
  passiveTurnHeal(state.cpu, "Rival's");
  if (checkWin()) { render(); return; }

  const cpuBear = state.cpu.team[state.cpu.active];

  if (cpuBear.frozenTurns > 0) {
    cpuBear.frozenTurns--;
    log(`Rival's ${cpuBear.name} is frozen and skips its turn! ❄️`, 'sys');
    endCpuTurn(); return;
  }
  if (state.cpuSkip) {
    state.cpuSkip = false;
    log(`Rival steps on the Log Trap and skips their turn! 🪵`, 'sys');
    endCpuTurn(); return;
  }
  if (cpuBear.stunnedTurns > 0) {
    cpuBear.stunnedTurns--;
    log(`Rival's ${cpuBear.name} is stunned and skips its turn! ⚡`, 'sys');
    endCpuTurn(); return;
  }

  const hpPct = cpuBear.hp / cpuBear.maxHp;
  if (hpPct < 0.25) {
    const betterIdx = state.cpu.team.findIndex((b, i) => b.alive && i !== state.cpu.active && b.hp / b.maxHp > 0.5);
    if (betterIdx !== -1) {
      state.cpu.active = betterIdx;
      const nb = state.cpu.team[betterIdx];
      log(`Rival swaps in ${nb.name}!`, 'cpu');
      applySwapInHeal(nb);
      endCpuTurn(); return;
    }
  }

  doAttack(state.cpu, state.player, 'Rival', 'You');
  if (state.over) return;
  endCpuTurn();
}

function endCpuTurn() {
  if (checkWin()) { render(); return; }
  render();
  state.turn = 'player';
  setBanner('Your turn — choose an action');
  render();
}

// ============ WIN/LOSS SAVING ============
async function checkWin() {
  const cpuAlive = state.cpu.team.some(b => b.alive);
  const playerAlive = state.player.team.some(b => b.alive);
  
  if (!cpuAlive) {
    state.over = true;
    playerStats.wins++;
    document.getElementById('record-display').innerText = `Wins: ${playerStats.wins} | Losses: ${playerStats.losses}`;
    
    // Save to Firebase
    if (window.firebaseAuth.currentUser) {
      const user = window.firebaseAuth.currentUser;
      await window.fbSetDoc(window.fbDoc(window.firebaseDb, "saves", user.uid), playerStats);
    }
    
    showOverlay('🏆 Victory!', "You defeated all the rival's bears!");
    return true;
  }
  
  if (!playerAlive) {
    state.over = true;
    playerStats.losses++;
    document.getElementById('record-display').innerText = `Wins: ${playerStats.wins} | Losses: ${playerStats.losses}`;
    
    // Save to Firebase
    if (window.firebaseAuth.currentUser) {
      const user = window.firebaseAuth.currentUser;
      await window.fbSetDoc(window.fbDoc(window.firebaseDb, "saves", user.uid), playerStats);
    }
    
    showOverlay('💀 Defeat...', 'All your bears were knocked out.');
    return true;
  }
  return false;
}

function showOverlay(title, sub) {
  document.getElementById('over-title').textContent = title;
  document.getElementById('over-sub').textContent = sub;
  document.getElementById('overlay').classList.remove('hidden');
  render();
}

// ============ LOGIN LOGIC ============
document.getElementById('btn-login').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value;
  const pass = document.getElementById('login-pass').value;
  try {
    document.getElementById('login-msg').innerText = "Logging in...";
    await window.fbSignIn(window.firebaseAuth, email, pass);
  } catch (e) {
    document.getElementById('login-msg').innerText = e.message;
  }
});

document.getElementById('btn-signup').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value;
  const pass = document.getElementById('login-pass').value;
  try {
    document.getElementById('login-msg').innerText = "Creating account...";
    await window.fbSignUp(window.firebaseAuth, email, pass);
  } catch (e) {
    document.getElementById('login-msg').innerText = e.message;
  }
});

window.fbOnAuth(window.firebaseAuth, async (user) => {
  if (user) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('game-container').style.display = 'flex';
    
    // Check database
    const docRef = window.fbDoc(window.firebaseDb, "saves", user.uid);
    const docSnap = await window.fbGetDoc(docRef);
    if (docSnap.exists()) {
      playerStats = docSnap.data();
      document.getElementById('record-display').innerText = `Wins: ${playerStats.wins} | Losses: ${playerStats.losses}`;
    } else {
      await window.fbSetDoc(docRef, playerStats); // create new file
    }
    
    log(`Welcome back, Ranger ${user.email}!`, 'sys');
    initGame(); // Start the game after login
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('game-container').style.display = 'none';
  }
});
</script>
